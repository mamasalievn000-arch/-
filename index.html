<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>IS Tools – Образовательная лаборатория</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--b:#1d4ed8;--b2:#3b82f6;--bg:#f3f7ff;--c:#fff;--t:#0f1b3d;--m:#5b6b8c;--l:#dbe5fb;--ok:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1226;--c:#131d3b;--t:#e8eeff;--m:#9fb0d6;--l:#243362;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t)}
#app{display:flex;min-height:100vh}
nav{width:250px;background:linear-gradient(180deg,#1e40af,#2563eb);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;flex:none;transition:.3s}
nav h2{font-size:18px;margin:0 8px 16px}nav a{display:block;padding:10px 12px;border-radius:10px;color:#e0e9ff;cursor:pointer;margin-bottom:4px}nav a:hover,nav a.on{background:rgba(255,255,255,.18);color:#fff}
main{flex:1;padding:24px;max-width:1100px;margin:auto;width:100%;min-width:0}
#burger{display:none;position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;z-index:20;background:var(--b);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:18px}
.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 10px rgba(29,78,216,.06)}
.hero{background:linear-gradient(135deg,#1d4ed8,#60a5fa);color:#fff;border:0;animation:in .6s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.lab{cursor:pointer;transition:.2s;animation:in .5s both}.lab:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(29,78,216,.18)}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.n{display:inline-block;background:var(--b);color:#fff;border-radius:8px;padding:2px 10px;font-weight:700;font-size:13px}
.bar{height:10px;background:var(--l);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--b2));transition:width .6s}
button,.btn{background:var(--b);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:15px;cursor:pointer}button:hover{background:#1e40af}button.s{background:var(--l);color:var(--t)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--l);border-radius:10px;background:var(--c);color:var(--t);font:inherit;margin:4px 0 10px}
.tag{font-size:12px;padding:2px 8px;border-radius:20px;background:var(--l);color:var(--m)}.ok{color:var(--ok);font-weight:600}
h1,h2,h3{margin-top:0}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--l);text-align:left}.sc{overflow-x:auto}
.q label{display:block;padding:6px 0;cursor:pointer}.stat{font-size:28px;font-weight:700;color:var(--b2)}
.cert{text-align:center;border:6px double var(--b);padding:40px}
@media(max-width:800px){nav{position:fixed;z-index:15;left:-260px;top:0}nav.open{left:0}#burger{display:block}main{padding:56px 14px 20px}}
@media print{nav,#burger,.np{display:none!important}body{background:#fff;color:#000}}
</style></head><body>
<button id="burger" onclick="document.querySelector('nav').classList.toggle('open')">☰</button>
<div id="app"><nav></nav><main></main></div>

["Итоговый проект","Разработать законченную ИС и защитить её.","Все изученные инструменты","Проект объединяет проектирование, БД, интерфейс, тестирование и документацию.",["Выберите тему и опишите требования","Спроектируйте и реализуйте систему","Протестируйте и подготовьте презентацию"],["ИС с БД, интерфейсом и авторизацией","Отчёт и презентация"],"Разверните проект онлайн.",[["Этап после разработки?",["Тестирование","Выбор темы","Сбор требований"],0],["Итоговый проект включает…",["Проектирование, реализацию, тестирование","Только вёрстку","Только отчёт"],0]]]];
let DB={u:{},t:{},s:null};try{DB=JSON.parse(localStorage.getItem('istools'))||DB}catch(e){}
const save=()=>{try{localStorage.setItem('istools',JSON.stringify(DB))}catch(e){}};
const me=()=>DB.u[DB.s],$=s=>document.querySelector(s),P=(u,i)=>(u.p[i]=u.p[i]||{});
const done=u=>L.filter((_,i)=>u.p[i]&&u.p[i].test!=null&&u.p[i].sub).length;
const pts=p=>Math.round((p.test||0)/2+(p.sub&&p.sub.grade!=null?p.sub.grade/2:0));
const total=u=>Math.round(L.reduce((a,_,i)=>a+pts(u.p[i]||{}),0)/L.length);
const mark=x=>x>=90?'Отлично':x>=75?'Хорошо':x>=60?'Удовлетворительно':'Не аттестован';
let view='home',arg=0,tab='st';
function go(v,a){view=v;arg=a||0;document.querySelector('nav').classList.remove('open');draw();scrollTo(0,0)}
function draw(){const u=me(),n=$('nav'),m=$('main');
if(!u){n.innerHTML='<h2>🎓 IS Tools</h2>';m.innerHTML=auth();return}
const items=[['home','🏠 Главная'],['labs','🧪 Лабораторные работы'],['cab','👤 Личный кабинет'],['cert','📜 Сертификат']];if(u.role=='t')items.push(['teach','🧑‍🏫 Панель преподавателя']);
n.innerHTML='<h2>🎓 IS Tools</h2>'+items.map(i=>`<a class="${view==i[0]?'on':''}" onclick="go('${i[0]}')">${i[1]}</a>`).join('')+'<a onclick="DB.s=null;save();go(\'home\')">🚪 Выйти</a>';
m.innerHTML=({home,labs,lab,cab,cert,teach})[view]();}
function auth(){return`<div class="card hero"><h1>IS Tools – Образовательная лаборатория</h1><p>Войдите или зарегистрируйтесь, чтобы начать обучение.</p></div><div class="card" style="max-width:420px"><h3 id="at">Вход</h3><div id="nm" style="display:none">Имя и фамилия<input id="a1"></div>E-mail<input id="a2" type="email">Пароль<input id="a3" type="password"><div id="rl" style="display:none">Роль<select id="a4"><option value="s">Студент</option><option value="t">Преподаватель (код: TEACH2026)</option></select><span id="cd">Код преподавателя<input id="a5"></span></div><button onclick="doAuth()" id="ab">Войти</button> <button class="s" onclick="reg=!reg;sw()">Режим: регистрация/вход</button><p id="er" style="color:#dc2626"></p></div>`}
let reg=false;function sw(){$('#at').textContent=reg?'Регистрация':'Вход';$('#nm').style.display=$('#rl').style.display=reg?'block':'none';$('#ab').textContent=reg?'Создать аккаунт':'Войти'}
function doAuth(){const e=$('#a2').value.trim().toLowerCase(),p=$('#a3').value,er=$('#er');if(!e||!p){er.textContent='Заполните e-mail и пароль';return}
if(reg){const nm=$('#a1').value.trim(),r=$('#a4').value;if(!nm||p.length<6){er.textContent='Укажите имя и пароль от 6 символов';return}
if(DB.u[e]){er.textContent='Такой e-mail уже зарегистрирован';return}
if(r=='t'&&$('#a5').value!='TEACH2026'){er.textContent='Неверный код преподавателя';return}
DB.u[e]={name:nm,pass:btoa(unescape(encodeURIComponent(p))),role:r,p:{}}}
else if(!DB.u[e]||DB.u[e].pass!=btoa(unescape(encodeURIComponent(p)))){er.textContent='Неверный e-mail или пароль';return}
DB.s=e;save();go('home')}
function home(){const u=me(),d=done(u);return`<div class="card hero"><h1>Инструментальные средства информационной системы</h1><p>Практический курс по проектированию, разработке, тестированию и использованию информационных систем с применением современных инструментов.</p><button class="s" onclick="go('labs')">Начать обучение →</button></div>
<div class="grid"><div class="card"><div class="stat">${L.length}</div>лабораторных работ</div><div class="card"><div class="stat">${d}/${L.length}</div>выполнено</div><div class="card"><div class="stat">${total(u)}</div>средний балл из 100</div></div>
<div class="card"><h3>Прогресс</h3><div class="bar"><i style="width:${d/L.length*100}%"></i></div></div>
<div class="card"><h3>Цели и задачи</h3><ul><li>Освоить инструменты проектирования: ER, BPMN, UML.</li><li>Научиться работать с MySQL, Access, Excel и no-code платформами.</li><li>Разрабатывать веб-интерфейсы и подключать REST API.</li><li>Тестировать ИС и обеспечивать авторизацию пользователей.</li><li>Применять ИИ в разработке и защитить итоговый проект.</li></ul></div>`}
function labs(){const u=me();return`<h1>Лабораторные работы</h1><div class="grid">${L.map((l,i)=>{const p=u.p[i]||{},ok=p.test!=null&&p.sub;return`<div class="card lab" style="animation-delay:${i*40}ms" onclick="go('lab',${i})"><span class="n">№${i+1}</span> ${ok?'<span class="ok">✔ выполнено</span>':p.sub?'<span class="tag">на проверке</span>':''}<h3 style="margin-top:10px;font-size:16px">${l[0]}</h3><div class="tag">${l[2]}</div><div class="bar" style="margin-top:12px"><i style="width:${ok?100:p.sub||p.test!=null?50:0}%"></i></div></div>`}).join('')}</div>`}
function lab(){const i=arg,l=L[i],u=me(),p=P(u,i),tk=DB.t[i]||l[5].join('\n'),s=p.sub;
return`<button class="s np" onclick="go('labs')">← Назад</button><h1><span class="n">№${i+1}</span> ${l[0]}</h1>
<div class="card"><h3>Цель работы</h3>${l[1]}<h3 style="margin-top:14px">Теоретические сведения</h3>${l[3]}<h3 style="margin-top:14px">Программные инструменты</h3>${l[2]}</div>
<div class="card"><h3>Пошаговая инструкция</h3><ol>${l[4].map(x=>`<li>${x}</li>`).join('')}</ol></div>
<div class="card"><h3>Практические задания</h3><ul>${tk.split('\n').map(x=>`<li>${x}</li>`).join('')}</ul><h3>Повышенной сложности ⭐</h3>${l[6]}</div>
<div class="card q"><h3>Контрольные вопросы и тест</h3><form id="qf">${l[7].map((q,k)=>`<p><b>${k+1}. ${q[0]}</b></p>${q[1].map((o,j)=>`<label><input type="radio" name="q${k}" value="${j}" style="width:auto;margin-right:8px">${o}</label>`).join('')}`).join('')}</form><button onclick="doTest(${i})">Проверить тест</button> <b id="tr">${p.test!=null?'Результат: '+p.test+'%':''}</b></div>
<div class="card"><h3>Загрузка выполненной работы</h3>${s?`<p>Отправлено: <b>${s.file}</b> — ${s.grade!=null?`оценка преподавателя: <b>${s.grade}/100</b>${s.rem?' — «'+s.rem+'»':''}`:'ожидает проверки'}</p>`:''}<input type="file" id="fl"><textarea id="nt" rows="3" placeholder="Комментарий для преподавателя"></textarea><button onclick="doSub(${i})">Отправить на проверку</button><p>Баллы за работу: <b>${pts(p)}/100</b></p></div>`}
function doTest(i){const f=$('#qf'),qs=L[i][7];let r=0;qs.forEach((q,k)=>{const c=f.querySelector(`[name=q${k}]:checked`);if(c&&+c.value==q[2])r++});const p=P(me(),i);p.test=Math.round(r/qs.length*100);save();$('#tr').textContent=`Результат: ${p.test}% (${r}/${qs.length})`}
function doSub(i){const f=$('#fl').files[0];if(!f){alert('Выберите файл');return}P(me(),i).sub={file:f.name,note:$('#nt').value,grade:null,rem:''};save();go('lab',i)}
function cab(){const u=me();return`<h1>Личный кабинет</h1><div class="card"><h3>${u.name}</h3>${DB.s} · ${u.role=='t'?'преподаватель':'студент'}<p>Выполнено: ${done(u)}/${L.length} · Итог: <b>${total(u)}/100</b> (${mark(total(u))})</p><div class="bar"><i style="width:${done(u)/L.length*100}%"></i></div></div><div class="card sc"><table><tr><th>№</th><th>Работа</th><th>Тест</th><th>Статус</th><th>Баллы</th></tr>${L.map((l,i)=>{const p=u.p[i]||{};return`<tr style="cursor:pointer" onclick="go('lab',${i})"><td>${i+1}</td><td>${l[0]}</td><td>${p.test!=null?p.test+'%':'—'}</td><td>${p.sub?(p.sub.grade!=null?'проверено':'на проверке'):'не сдано'}</td><td>${pts(p)}</td></tr>`}).join('')}</table></div>`}
function cert(){const u=me(),d=done(u)==L.length;return d?`<div class="card cert"><h2>СЕРТИФИКАТ</h2><p>IS Tools – Образовательная лаборатория</p><p>Настоящим подтверждается, что</p><h1>${u.name}</h1><p>успешно завершил(а) курс<br><b>«Инструментальные средства информационной системы»</b></p><p>Итоговый балл: <b>${total(u)}/100</b> — ${mark(total(u))}</p><p>${new Date().toLocaleDateString('ru-RU')}</p></div><button class="np" onclick="print()">Печать / PDF</button>`:`<h1>Сертификат</h1><div class="card">Сертификат станет доступен после выполнения всех ${L.length} работ (тест + отправка). Сейчас: ${done(u)}/${L.length}.</div>`}
function teach(){const us=Object.entries(DB.u).filter(x=>x[1].role=='s');
const tabs=`<div class="np" style="margin-bottom:14px">${[['st','Студенты'],['rv','Проверка работ'],['ed','Задания']].map(t=>`<button class="${tab==t[0]?'':'s'}" onclick="tab='${t[0]}';draw()">${t[1]}</button>`).join(' ')}</div>`;let b='';
if(tab=='st')b=`<div class="card sc"><table><tr><th>Студент</th><th>E-mail</th><th>Выполнено</th><th>Итог</th></tr>${us.map(([e,u])=>`<tr><td>${u.name}</td><td>${e}</td><td>${done(u)}/${L.length}</td><td>${total(u)}</td></tr>`).join('')||'<tr><td>Студентов пока нет</td></tr>'}</table></div>`;
if(tab=='rv'){const r=[];us.forEach(([e,u])=>L.forEach((l,i)=>{const s=u.p[i]&&u.p[i].sub;if(s)r.push([e,u,i,s])}));b=r.map(([e,u,i,s])=>`<div class="card"><b>${u.name}</b> · Работа №${i+1}<br>Файл: ${s.file}${s.note?'<br>«'+s.note+'»':''}<br><input id="g${e}${i}" type="number" min="0" max="100" placeholder="Оценка 0–100" value="${s.grade??''}" style="max-width:160px"><input id="r${e}${i}" placeholder="Комментарий" value="${s.rem||''}"><button onclick="grade('${e}',${i})">Сохранить оценку</button></div>`).join('')||'<div class="card">Работ на проверку нет.</div>'}
if(tab=='ed')b=`<div class="card">Работа<select id="es" onchange="$('#et').value=DB.t[this.value]||L[this.value][5].join('\\n')">${L.map((l,i)=>`<option value="${i}">№${i+1} ${l[0]}</option>`).join('')}</select>Практические задания (по одному в строке)<textarea id="et" rows="6">${L[0][5].join('\n')}</textarea><button onclick="DB.t[$('#es').value]=$('#et').value;save();alert('Сохранено')">Сохранить задание</button></div>`;
return`<h1>Панель преподавателя</h1>${tabs}${b}`}
function grade(e,i){const s=DB.u[e].p[i].sub,g=+$(`[id="g${e}${i}"]`).value;if(isNaN(g)||g<0||g>100){alert('Оценка 0–100');return}s.grade=g;s.rem=$(`[id="r${e}${i}"]`).value;save();alert('Сохранено')}
draw();
</script></body></html>
